name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Add Google web client id
        run: |
          cat > android/app/src/main/res/values/firebase_auth.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">739866058337-oau5e4vtfgqrdttbtmbvmmvqfqr8uc6s.apps.googleusercontent.com</string>
          </resources>
          XML
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-planner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest daily-planner.apk --title "Daily Planner" --notes "حمّل ملف daily-planner.apk وثبّته على أندرويد. التطبيق بيتحدث تلقائيًا." --latest
