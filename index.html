<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF1EF" />
    <title>Daily Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.goatcounter = {
        path: function () {
          var c = window.Capacitor, apk = (c && c.isNativePlatform && c.isNativePlatform()) || /; wv\)/.test(navigator.userAgent)
          return apk ? '/apk' : (matchMedia('(display-mode: standalone)').matches ? '/installed-web' : '/web')
        },
      }
    </script>
    <script data-goatcounter="https://dailyplanner-safy.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
